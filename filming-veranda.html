<!-- Add veranda filming photo to About page -->
<style>
.fv-figure{position:relative; display:inline-block; max-width:100%; margin:0;}
.fv-figure .fv-img-wrap{width:100%; max-width:800px; aspect-ratio:16/9; overflow:hidden; border-radius:4px;}
.fv-figure img{width:100%; height:100%; object-fit:cover; object-position:70% 50%; display:block;}
.fv-figure figcaption{position:absolute; right:0; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.6); color:#fff; padding:8px 12px; border-radius:4px; font-size:0.95em; max-width:60%;}
@media (max-width:600px){
  .fv-figure{display:block;}
  .fv-figure figcaption{position:static; transform:none; margin-top:0.5rem; background:transparent; color:inherit; padding:0; border-radius:0; max-width:none;}
}
</style>
<figure class="fv-figure" aria-labelledby="fv-caption">
  <div class="fv-img-wrap">
    <img src="https://caribbeanstorytimestudios.com/assets/filming-veranda.jpg" alt="Filming a documentary interview on a Jamaican veranda" />
  </div>
  <figcaption id="fv-caption">Preserving Our History Through the Voices of Our Elders</figcaption>
</figure>
